name: N5 patch helper

on:
  push:
    branches:
      - telemt-n5-helper
    paths:
      - .github/workflows/n5-helper.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: telemt-3.5.6-web
          fetch-depth: 0
      - name: Add exact N5 CI assertions
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/telemt-3.5.6-web-ci.yml')
          s = p.read_text()
          anchor = "          grep -q 'duplicate WEB auto carrier candidate' files/telemt.init\n"
          extra = (
              "          # N5: strict auto validation is active only while WEB itself is enabled.\n"
              "          grep -Fq 'if [ \"$web_enabled\" -eq 1 ] && [ \"$web_carrier_policy\" = \"auto\" ]; then' files/telemt.init\n"
              "          test \"$(grep -Fc 'if [ \"$web_carrier_policy\" = \"auto\" ]; then' files/telemt.init)\" -eq 1\n"
          )
          if s.count(anchor) != 1:
              raise SystemExit(f'expected one insertion anchor, found {s.count(anchor)}')
          if 'strict auto validation is active only while WEB itself is enabled' in s:
              raise SystemExit('N5 assertions already present')
          p.write_text(s.replace(anchor, anchor + extra, 1))
          PY
          git diff --check
          git diff -- .github/workflows/telemt-3.5.6-web-ci.yml
      - name: Commit target branch
        run: |
          set -euxo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/telemt-3.5.6-web-ci.yml
          git commit -m 'ci: validate disabled WEB isolation'
          git push origin HEAD:telemt-3.5.6-web
