name: N5 patch helper

on:
  push:
    branches:
      - telemt-n5-helper
    paths:
      - .github/workflows/n5-helper.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: telemt-3.5.6-web
          fetch-depth: 0
      - name: Apply exact N5 isolation patch
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('files/telemt.init')
          s = p.read_text()
          old = '    if [ "$web_carrier_policy" = "auto" ]; then\n'
          new = '    if [ "$web_enabled" -eq 1 ] && [ "$web_carrier_policy" = "auto" ]; then\n'
          if s.count(old) != 1:
              raise SystemExit(f'expected exactly one target, found {s.count(old)}')
          p.write_text(s.replace(old, new, 1))
          PY
          git diff --check
          test "$(git diff --numstat -- files/telemt.init | awk '{print $1+$2}')" -eq 2
          git diff -- files/telemt.init
      - name: Commit target branch
        run: |
          set -euxo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add files/telemt.init
          git commit -m 'core: isolate disabled WEB config validation'
          git push origin HEAD:telemt-3.5.6-web
