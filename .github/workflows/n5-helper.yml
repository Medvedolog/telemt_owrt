name: N5 patch helper

on:
  push:
    branches:
      - telemt-n5-helper
    paths:
      - .github/workflows/n5-helper.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: telemt-3.5.6-web
          fetch-depth: 0
      - name: Add exact N5 CI assertion
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/telemt-3.5.6-web-ci.yml')
          s = p.read_text()
          old = "          grep -q 'duplicate WEB auto carrier candidate' files/telemt.init\n          grep -q 'if \\\[ \"$web_carrier_policy\" = \"auto\" \\\]; then' files/telemt.init\n"
          new = "          grep -q 'duplicate WEB auto carrier candidate' files/telemt.init\n          # N5: malformed auto settings are strict only when WEB is enabled.\n          grep -q 'if \\\[ \"$web_enabled\" -eq 1 \\\] && \\\[ \"$web_carrier_policy\" = \"auto\" \\\]; then' files/telemt.init\n          # The second auto guard is the TOML emission guard and must remain policy-only.\n          test \"$(grep -c 'if \\\[ \"$web_carrier_policy\" = \"auto\" \\\]; then' files/telemt.init)\" -eq 1\n"
          if s.count(old) != 1:
              raise SystemExit(f'expected one CI insertion point, found {s.count(old)}')
          p.write_text(s.replace(old, new, 1))
          PY
          git diff --check
          git diff -- .github/workflows/telemt-3.5.6-web-ci.yml
      - name: Commit target branch
        run: |
          set -euxo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/telemt-3.5.6-web-ci.yml
          git commit -m 'ci: validate disabled WEB isolation'
          git push origin HEAD:telemt-3.5.6-web
