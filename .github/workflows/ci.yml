name: CI

on:
  push:
    branches: [main, telemt-3.5.6-web]
    tags: ['[0-9]+.[0-9]+.[0-9]+', '[0-9]+.[0-9]+.[0-9]+-[0-9]+']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  UPSTREAM_REPO: telemt/telemt
  AARCH64_TARGET: aarch64-unknown-linux-musl
  AARCH64_OUT_BIN: telemt-aarch64-musl
  X86_64_ASSET_NAME: telemt-x86_64-linux-musl.tar.gz
  X86_64_ASSET_SHA256_NAME: telemt-x86_64-linux-musl.tar.gz.sha256
  X86_64_OUT_BIN: telemt-x86_64-musl

jobs:
  sources:
    name: Sources and contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - run: bash tools/check-sources.sh

  build:
    name: Build native OpenWrt packages
    needs: sources
    runs-on: ubuntu-latest
    outputs:
      base-version: ${{ steps.version.outputs.base }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Resolve version
        id: version
        run: |
          set -eu
          eval "$(sh tools/version.sh)"
          echo "BASE_VERSION=$BASE_VERSION" >> "$GITHUB_ENV"
          echo "PKG_VERSION=$PKG_VERSION" >> "$GITHUB_ENV"
          echo "base=$BASE_VERSION" >> "$GITHUB_OUTPUT"
          echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"

      - name: Checkout upstream Telemt ${{ env.BASE_VERSION }}
        uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ env.BASE_VERSION }}
          path: upstream_src

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-musl

      - name: Verify upstream version, MSRV, and lockfile
        run: |
          set -euxo pipefail
          test -f upstream_src/Cargo.lock
          grep -Fq "version = \"${BASE_VERSION}\"" upstream_src/Cargo.toml
          REQUIRED_RUST="$(sed -n 's/^rust-version = "\([^"]*\)"/\1/p' upstream_src/Cargo.toml | head -n1)"
          CURRENT_RUST="$(rustc --version | awk '{print $2}')"
          test -n "$REQUIRED_RUST"
          test -n "$CURRENT_RUST"
          if [ "$(printf '%s\n%s\n' "$REQUIRED_RUST" "$CURRENT_RUST" | sort -V | head -n1)" != "$REQUIRED_RUST" ]; then
            echo "ERROR: rustc $CURRENT_RUST is older than upstream MSRV $REQUIRED_RUST" >&2
            exit 1
          fi

      - name: Install build tools
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y jq curl tar xz-utils zstd upx-ucl file binutils
          CROSS_TAG="$(curl -fsSL -H "Authorization: Bearer ${GITHUB_TOKEN}" -H "X-GitHub-Api-Version: 2022-11-28" https://api.github.com/repos/cross-rs/cross/releases/latest | jq -r .tag_name)"
          curl -fsSL "https://github.com/cross-rs/cross/releases/download/${CROSS_TAG}/cross-x86_64-unknown-linux-musl.tar.gz" | tar -xz
          sudo install -m 0755 cross /usr/local/bin/cross

      - uses: owfeed/owfeed/setup@v0.5.1
        with:
          version: v0.5.1

      - name: Build aarch64 Telemt (locked, size-optimised, UPX)
        run: |
          set -euxo pipefail
          cd upstream_src
          export CARGO_PROFILE_RELEASE_OPT_LEVEL=z
          export CARGO_PROFILE_RELEASE_LTO=true
          export CARGO_PROFILE_RELEASE_CODEGEN_UNITS=1
          export CARGO_PROFILE_RELEASE_PANIC=abort
          export CARGO_PROFILE_RELEASE_STRIP=true
          cross build --release --locked --target "$AARCH64_TARGET"
          cd ..
          upx --best --lzma "upstream_src/target/${AARCH64_TARGET}/release/telemt"
          cp "upstream_src/target/${AARCH64_TARGET}/release/telemt" "$AARCH64_OUT_BIN"
          printf '\nMTProxy v%s\n' "$BASE_VERSION" >> "$AARCH64_OUT_BIN"
          chmod 0755 "$AARCH64_OUT_BIN"
          file "$AARCH64_OUT_BIN"

      - name: Verify upstream x86_64 release and add version trailer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          mkdir -p upstream_release extracted_x86_64
          gh release download "$BASE_VERSION" \
            --repo "$UPSTREAM_REPO" \
            --pattern "$X86_64_ASSET_NAME" \
            --pattern "$X86_64_ASSET_SHA256_NAME" \
            --dir upstream_release
          (cd upstream_release && sha256sum -c "$X86_64_ASSET_SHA256_NAME")
          tar -xzf "upstream_release/$X86_64_ASSET_NAME" -C extracted_x86_64
          BIN_PATH="$(find extracted_x86_64 -type f -name telemt | head -n1)"
          test -n "$BIN_PATH"
          install -m 0755 "$BIN_PATH" "$X86_64_OUT_BIN"
          printf '\nMTProxy v%s\n' "$BASE_VERSION" >> "$X86_64_OUT_BIN"

      - name: Stage packages
        run: |
          AARCH64_BIN="$PWD/$AARCH64_OUT_BIN" X86_64_BIN="$PWD/$X86_64_OUT_BIN" \
            UPSTREAM_LICENSE="$PWD/upstream_src/LICENSE" ./tools/stage.sh

      - run: owfeed plan
      - run: owfeed check
      - run: owfeed build
      - run: sh tools/check-package.sh

      - uses: actions/upload-artifact@v4
        with:
          name: owfeed-packages
          path: dist/
          if-no-files-found: error

  verify:
    name: Install on real OpenWrt userspace
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: owfeed-packages
          path: dist/

      - uses: owfeed/owlab/setup@v0.6.5
        with:
          version: v0.6.5

      # owlab runs x86_64, so this exercises the real binary and the maintainer
      # scripts; the aarch64 packages are checked structurally in the build job.
      - name: OpenWrt 25.12 APKv3
        uses: owfeed/owlab/action@v0.6.5
        with:
          version: v0.6.5
          releases: "25.12.5"
          install: dist/x86_64/telemt-*.apk
          assert: |
            package telemt
            file /usr/bin/telemt
            file /etc/init.d/telemt
            file /etc/config/telemt
            exec test "$(uci -q get telemt.general)" = telemt
            exec test "$(uci -q get telemt.general.enabled)" = 0
            file /usr/libexec/telemt-web-check
            file /usr/libexec/telemt-web-frontend
            file /usr/libexec/telemt-web-nginx
            file /etc/hotplug.d/acme/95-telemt-web-haproxy
            exec grep -a -q "MTProxy v${{ needs.build.outputs.base-version }}" /usr/bin/telemt
            exec uci -q get telemt.web.enabled | grep -qx 0
            exec uci -q get telemt.web_listener.port | grep -qx 27453

      - name: OpenWrt 24.10 IPK
        uses: owfeed/owlab/action@v0.6.5
        with:
          version: v0.6.5
          releases: "24.10.8"
          install: dist/x86_64/telemt_*.ipk
          assert: |
            package telemt
            file /usr/bin/telemt
            file /etc/init.d/telemt
            file /etc/config/telemt
            exec test "$(uci -q get telemt.general)" = telemt
            exec test "$(uci -q get telemt.general.enabled)" = 0
            file /usr/libexec/telemt-web-check
            file /usr/libexec/telemt-web-frontend
            file /usr/libexec/telemt-web-nginx
            file /etc/hotplug.d/acme/95-telemt-web-haproxy
            exec grep -a -q "MTProxy v${{ needs.build.outputs.base-version }}" /usr/bin/telemt
            exec uci -q get telemt.web.enabled | grep -qx 0
            exec uci -q get telemt.web_listener.port | grep -qx 27453

  release-preflight:
    name: Release signing preflight
    needs: [build, verify]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Verify committed public signing keys
        run: |
          set -eu
          test -s keys/telemt-sign.pub.pem || { echo 'missing keys/telemt-sign.pub.pem; run tools/setup-keys.sh once and commit the public keys'; exit 1; }
          test -s keys/telemt-release.pub || { echo 'missing keys/telemt-release.pub; run tools/setup-keys.sh once and commit the public keys'; exit 1; }

  release:
    name: Sign and publish
    needs: [build, verify, release-preflight]
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    uses: owfeed/owfeed/.github/workflows/package.yml@v0.5.1
    secrets:
      sign-key: ${{ secrets.TELEMT_SIGN_KEY }}
      usign-key: ${{ secrets.TELEMT_USIGN_KEY }}
    with:
      owfeed-version: v0.5.1
      verify-with: keys/telemt-release.pub
