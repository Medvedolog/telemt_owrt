name: Validate Telemt 3.5.6 WEB branch

on:
  push:
    branches:
      - telemt-3.5.6-web
  workflow_dispatch:

jobs:
  validate:
    name: Build and package validation
    runs-on: ubuntu-latest
    permissions:
      contents: read
      attestations: read

    env:
      VERSION: '3.5.6'
      UPSTREAM_REPO: telemt/telemt
      AARCH64_TARGET: aarch64-unknown-linux-musl
      AARCH64_OUT_BIN: telemt-aarch64-musl
      X86_64_ASSET_NAME: telemt-x86_64-linux-musl.tar.gz
      X86_64_ASSET_SHA256_NAME: telemt-x86_64-linux-musl.tar.gz.sha256
      X86_64_OUT_BIN: telemt-x86_64-musl

    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4

      - name: Validate OpenWrt shell and packaging references
        shell: bash
        run: |
          set -euxo pipefail

          sh -n files/telemt.init
          sh -n files/telemt-web-check
          sh -n files/telemt-web-frontend
          sh -n files/telemt-web-nginx
          sh -n files/telemt-web-haproxy.hotplug

          grep -q "option port '27453'" files/telemt.config
          grep -q "option nginx_managed '0'" files/telemt.config
          grep -q "option nginx_bind '443'" files/telemt.config
          grep -q 'config_get web_port web_listener port "27453"' files/telemt.init
          grep -q 'config_get web_port web_listener port .*27453' files/telemt-web-check
          grep -q 'config_get web_port web_listener port .*27453' files/telemt-web-frontend
          grep -q "FRAGMENT=/etc/nginx/conf.d/telemt-web.conf" files/telemt-web-nginx
          grep -q "MARKER='# TELEMT-MANAGED-NGINX v1'" files/telemt-web-nginx
          grep -q 'proxy_set_header X-Forwarded-For $remote_addr;' files/telemt-web-nginx
          grep -q 'proxy_next_upstream off;' files/telemt-web-nginx

          if grep -R -n -E "option port '18080'|port = 18080|127\.0\.0\.1:18080|127\.0\.0\.1:18081" \
            ROADMAP_3.5_WEB.md docs/WEB_EXTERNAL_FRONTEND.ru.md docs/WEB_HAPROXY_MANAGED.ru.md \
            files/telemt.config files/telemt.init files/telemt-web-check files/telemt-web-frontend files/telemt-web-nginx; then
            echo 'ERROR: stale 1808x WEB endpoint found' >&2
            exit 1
          fi

          RELEASE_WF=.github/workflows/telemt-release-aarch64-upx.yml
          grep -q 'uses: owfeed/owfeed/setup@v0.5.1' "$RELEASE_WF"
          grep -q "OPENWRT_APK_SDK_RELEASE: '25.12.2'" "$RELEASE_WF"
          grep -q 'owfeed --config owfeed-release.yml build --release 25.12' "$RELEASE_WF"
          grep -q 'test "$MAGIC" = 414442' "$RELEASE_WF"
          grep -q 'conffiles: \["/etc/config/telemt"\]' "$RELEASE_WF"
          grep -q 'dst: /usr/libexec/telemt-web-check' "$RELEASE_WF"
          grep -q 'dst: /usr/libexec/telemt-web-frontend' "$RELEASE_WF"
          grep -q 'dst: /usr/libexec/telemt-web-nginx' "$RELEASE_WF"
          grep -q 'install -m 0755 files/telemt-web-nginx' "$RELEASE_WF"
          grep -q 'dst: /etc/hotplug.d/acme/95-telemt-web-haproxy' "$RELEASE_WF"
          grep -q 'dst: /etc/config/telemt' "$RELEASE_WF"
          if grep -q -- '--packager apk' "$RELEASE_WF"; then
            echo 'ERROR: release workflow still uses nFPM Alpine APKv2 packaging' >&2
            exit 1
          fi

      - name: Checkout upstream Telemt 3.5.6
        uses: actions/checkout@v4
        with:
          repository: telemt/telemt
          ref: 3.5.6
          path: upstream_src

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-musl

      - name: Verify upstream version, MSRV, and lockfile
        shell: bash
        run: |
          set -euxo pipefail

          test -f upstream_src/Cargo.lock
          grep -q '^version = "3\.5\.6"' upstream_src/Cargo.toml
          REQUIRED_RUST="$(sed -n 's/^rust-version = "\([^"]*\)"/\1/p' upstream_src/Cargo.toml | head -n1)"
          CURRENT_RUST="$(rustc --version | awk '{print $2}')"
          test -n "$REQUIRED_RUST"
          test -n "$CURRENT_RUST"
          echo "Upstream MSRV: $REQUIRED_RUST"
          echo "Runner rustc: $CURRENT_RUST"
          if [ "$(printf '%s\n%s\n' "$REQUIRED_RUST" "$CURRENT_RUST" | sort -V | head -n1)" != "$REQUIRED_RUST" ]; then
            echo "ERROR: rustc $CURRENT_RUST is older than upstream MSRV $REQUIRED_RUST" >&2
            exit 1
          fi

      - name: Install build and IPK packaging tools
        shell: bash
        run: |
          set -euxo pipefail

          sudo apt-get update
          sudo apt-get install -y jq curl tar xz-utils zstd dos2unix upx-ucl file binutils

          CROSS_TAG="$(curl -fsSL https://api.github.com/repos/cross-rs/cross/releases/latest | jq -r .tag_name)"
          curl -fsSL "https://github.com/cross-rs/cross/releases/download/${CROSS_TAG}/cross-x86_64-unknown-linux-musl.tar.gz" | tar -xz
          sudo install -m 0755 cross /usr/local/bin/cross

          NFPM_TAG="$(curl -fsSL https://api.github.com/repos/goreleaser/nfpm/releases/latest | jq -r .tag_name)"
          NFPM_VER="${NFPM_TAG#v}"
          curl -fsSL "https://github.com/goreleaser/nfpm/releases/download/${NFPM_TAG}/nfpm_${NFPM_VER}_Linux_x86_64.tar.gz" | tar -xz
          sudo install -m 0755 nfpm /usr/local/bin/nfpm

      - name: Setup verified owfeed
        uses: owfeed/owfeed/setup@v0.5.1
        with:
          version: v0.5.1

      - name: Build aarch64 Telemt 3.5.6 locked
        shell: bash
        run: |
          set -euxo pipefail

          cd upstream_src
          export CARGO_PROFILE_RELEASE_OPT_LEVEL=z
          export CARGO_PROFILE_RELEASE_LTO=true
          export CARGO_PROFILE_RELEASE_CODEGEN_UNITS=1
          export CARGO_PROFILE_RELEASE_PANIC=abort
          export CARGO_PROFILE_RELEASE_STRIP=true
          cross build --release --locked --target "$AARCH64_TARGET"
          cd ..

          upx --best --lzma "upstream_src/target/${AARCH64_TARGET}/release/telemt"
          cp "upstream_src/target/${AARCH64_TARGET}/release/telemt" "$AARCH64_OUT_BIN"
          printf '\nMTProxy v%s\n' "$VERSION" >> "$AARCH64_OUT_BIN"
          chmod 0755 "$AARCH64_OUT_BIN"
          file "$AARCH64_OUT_BIN"
          tail -c 512 "$AARCH64_OUT_BIN" | grep -a -q "MTProxy v${VERSION}"

      - name: Verify upstream x86_64 release and trailer
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p upstream_release extracted_x86_64
          gh release download "$VERSION" \
            --repo "$UPSTREAM_REPO" \
            --pattern "$X86_64_ASSET_NAME" \
            --pattern "$X86_64_ASSET_SHA256_NAME" \
            --dir upstream_release

          cd upstream_release
          sha256sum -c "$X86_64_ASSET_SHA256_NAME"
          cd ..

          tar -xzf "upstream_release/$X86_64_ASSET_NAME" -C extracted_x86_64
          BIN_PATH="$(find extracted_x86_64 -type f -name telemt | head -n1)"
          test -n "$BIN_PATH"
          install -m 0755 "$BIN_PATH" "$X86_64_OUT_BIN"
          printf '\nMTProxy v%s\n' "$VERSION" >> "$X86_64_OUT_BIN"
          tail -c 512 "$X86_64_OUT_BIN" | grep -a -q "MTProxy v${VERSION}"

      - name: Build and inspect OpenWrt 24.10 IPK
        shell: bash
        run: |
          set -euxo pipefail

          dos2unix files/telemt.init files/telemt.config files/telemt-web-check \
            files/telemt-web-frontend files/telemt-web-nginx files/telemt-web-haproxy.hotplug

          cat > nfpm-ci.yaml <<EOF
          name: telemt
          arch: aarch64_generic
          platform: linux
          version: ${VERSION}
          section: net
          priority: optional
          maintainer: Telemt Team
          description: Telemt 3.5.6 WEB branch CI package
          contents:
            - src: ./${AARCH64_OUT_BIN}
              dst: /usr/bin/telemt
              file_info:
                mode: 0755
            - src: ./files/telemt.init
              dst: /etc/init.d/telemt
              file_info:
                mode: 0755
            - src: ./files/telemt-web-check
              dst: /usr/libexec/telemt-web-check
              file_info:
                mode: 0755
            - src: ./files/telemt-web-frontend
              dst: /usr/libexec/telemt-web-frontend
              file_info:
                mode: 0755
            - src: ./files/telemt-web-nginx
              dst: /usr/libexec/telemt-web-nginx
              file_info:
                mode: 0755
            - src: ./files/telemt-web-haproxy.hotplug
              dst: /etc/hotplug.d/acme/95-telemt-web-haproxy
              file_info:
                mode: 0755
            - src: ./files/telemt.config
              dst: /etc/config/telemt
              type: config
              file_info:
                mode: 0644
          EOF

          nfpm package --config nfpm-ci.yaml --packager ipk --target telemt-ci.ipk
          test -s telemt-ci.ipk

          mkdir -p ipk-unpack
          tar -xzf telemt-ci.ipk -C ipk-unpack
          test -f ipk-unpack/debian-binary
          test -f ipk-unpack/control.tar.gz
          test -f ipk-unpack/data.tar.gz
          tar -tzf ipk-unpack/data.tar.gz > ipk-files.txt
          tar -xOzf ipk-unpack/control.tar.gz ./control > ipk-control.txt
          grep -q '^Architecture: aarch64_generic$' ipk-control.txt
          grep -q '^Package: telemt$' ipk-control.txt

          for path in \
            usr/bin/telemt \
            etc/init.d/telemt \
            usr/libexec/telemt-web-check \
            usr/libexec/telemt-web-frontend \
            usr/libexec/telemt-web-nginx \
            etc/hotplug.d/acme/95-telemt-web-haproxy \
            etc/config/telemt; do
            grep -Eq "(^|\./)${path}$" ipk-files.txt
          done

      - name: Stage architecture-specific OpenWrt APKv3 payloads
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf .ci/stage dist
          for arch in aarch64_generic aarch64_cortex-a53 x86_64; do
            root=".ci/stage/${arch}"
            mkdir -p "$root/usr/bin" "$root/etc/init.d" "$root/etc/config" \
              "$root/usr/libexec" "$root/etc/hotplug.d/acme"

            if [ "$arch" = x86_64 ]; then
              install -m 0755 "$X86_64_OUT_BIN" "$root/usr/bin/telemt"
            else
              install -m 0755 "$AARCH64_OUT_BIN" "$root/usr/bin/telemt"
            fi
            install -m 0755 files/telemt.init "$root/etc/init.d/telemt"
            install -m 0755 files/telemt-web-check "$root/usr/libexec/telemt-web-check"
            install -m 0755 files/telemt-web-frontend "$root/usr/libexec/telemt-web-frontend"
            install -m 0755 files/telemt-web-nginx "$root/usr/libexec/telemt-web-nginx"
            install -m 0755 files/telemt-web-haproxy.hotplug "$root/etc/hotplug.d/acme/95-telemt-web-haproxy"
            install -m 0644 files/telemt.config "$root/etc/config/telemt"
          done

          cat > owfeed.yml <<'EOF'
          version: 1
          feed:
            name: telemt-ci
            url: https://example.invalid/telemt-ci
            title: Telemt CI
            maintainer: "Telemt Team <noreply@example.invalid>"
          publish:
            - target: github-pages
          build:
            sdk:
              release: "25.12.2"
          releases:
            - line: "25.12"
              format: apk
              default: true
              arches: [aarch64_generic, aarch64_cortex-a53, x86_64]
          packages:
            - name: telemt
              build: mkpkg
              arch: [aarch64_generic, aarch64_cortex-a53, x86_64]
              version: 3.5.6-r1
              files: ./.ci/stage/{arch}
              description: "Telemt 3.5.6 WEB branch CI package"
              url: https://github.com/Medvedolog/telemt_owrt
              conffiles: ["/etc/config/telemt"]
          EOF

      - name: Build and verify OpenWrt 25.12 APKv3
        shell: bash
        run: |
          set -euxo pipefail

          owfeed lock --update
          owfeed build --release 25.12 -o dist

          test "$(find dist -type f -name '*.apk' | wc -l)" -eq 3
          for arch in aarch64_generic aarch64_cortex-a53 x86_64; do
            apk="dist/${arch}/telemt-3.5.6-r1.apk"
            test -s "$apk"
            magic="$(od -An -tx1 -N3 "$apk" | tr -d ' \n')"
            test "$magic" = 414442
          done

      - name: Upload CI packages
        uses: actions/upload-artifact@v4
        with:
          name: telemt-3.5.6-web-ci
          retention-days: 7
          path: |
            telemt-aarch64-musl
            telemt-x86_64-musl
            telemt-ci.ipk
            ipk-files.txt
            ipk-control.txt
            dist/*/*.apk
            owfeed.lock
