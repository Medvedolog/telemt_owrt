name: Validate Telemt 3.5.7 WEB branch

on:
  push:
    branches:
      - telemt-3.5.6-web
  workflow_dispatch:

jobs:
  validate:
    name: Build and package validation
    runs-on: ubuntu-latest
    permissions:
      contents: read
      attestations: read

    env:
      VERSION: '3.5.7'
      UPSTREAM_REPO: telemt/telemt
      AARCH64_TARGET: aarch64-unknown-linux-musl
      AARCH64_OUT_BIN: telemt-aarch64-musl
      X86_64_ASSET_NAME: telemt-x86_64-linux-musl.tar.gz
      X86_64_ASSET_SHA256_NAME: telemt-x86_64-linux-musl.tar.gz.sha256
      X86_64_OUT_BIN: telemt-x86_64-musl

    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4

      - name: Validate OpenWrt shell and WEB contracts
        shell: bash
        run: |
          set -euxo pipefail

          sh -n files/telemt.init
          sh -n files/telemt.postinst
          sh -n files/telemt-web-check
          grep -q 'ensure_section web web' files/telemt.postinst
          grep -q 'ensure_option web enabled 0' files/telemt.postinst
          grep -q 'ensure_section web_listener web_listener' files/telemt.postinst
          grep -q 'uci -q commit telemt' files/telemt.postinst
          sh -n files/telemt-web-frontend
          sh -n files/telemt-web-nginx
          sh -n files/telemt-web-haproxy.hotplug

          grep -q "option port '27453'" files/telemt.config
          grep -q "option nginx_managed '0'" files/telemt.config
          grep -q "option nginx_bind '443'" files/telemt.config
          grep -q "option direct_relay_buffer_budget_max_mib '0'" files/telemt.config
          grep -q 'direct_relay_buffer_budget_max_bytes = $direct_relay_buffer_budget_max_bytes' files/telemt.init
          grep -q 'config_get web_port web_listener port "27453"' files/telemt.init

          grep -q 'https|https-lanes|websocket|websocket-lanes) ;;' files/telemt.init
          grep -q 'web_carrier="https"' files/telemt.init
          grep -q 'carrier = "$web_carrier"' files/telemt.init
          grep -q "option carrier_policy 'fixed'" files/telemt.config
          grep -q "list carrier_candidate 'websocket-lanes'" files/telemt.config
          grep -q "list carrier_candidate 'websocket'" files/telemt.config
          grep -q "list carrier_candidate 'https-lanes'" files/telemt.config
          grep -q "option carrier_learning '1'" files/telemt.config
          grep -q "option carrier_negotiation_aggressiveness 'conservative'" files/telemt.config
          grep -q 'WEB auto carrier policy requires at least one carrier_candidate' files/telemt.init
          grep -q 'duplicate WEB auto carrier candidate' files/telemt.init

          grep -q 'alpn h2,http/1.1' files/telemt-web-frontend
          grep -q 'retries 0' files/telemt-web-frontend
          grep -q 'http2 on;' files/telemt-web-nginx
          grep -q 'proxy_http_version 1.1;' files/telemt-web-nginx
          grep -q 'proxy_set_header Upgrade $http_upgrade;' files/telemt-web-nginx
          grep -q 'proxy_set_header Connection $telemt_connection_upgrade;' files/telemt-web-nginx
          grep -q 'proxy_next_upstream off;' files/telemt-web-nginx

          if grep -R -n -E "option port '18080'|port = 18080|127\\.0\\.0\\.1:18080|127\\.0\\.0\\.1:18081" \
            ROADMAP_3.5_WEB.md docs/WEB_EXTERNAL_FRONTEND.ru.md docs/WEB_HAPROXY_MANAGED.ru.md \
            files/telemt.config files/telemt.init files/telemt-web-check files/telemt-web-frontend files/telemt-web-nginx; then
            echo 'ERROR: stale 1808x WEB endpoint found' >&2
            exit 1
          fi


      - name: Checkout upstream Telemt 3.5.7
        uses: actions/checkout@v4
        with:
          repository: telemt/telemt
          ref: 3.5.7
          path: upstream_src

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-musl

      - name: Verify upstream version, MSRV, and lockfile
        shell: bash
        run: |
          set -euxo pipefail
          test -f upstream_src/Cargo.lock
          grep -Fq 'version = "3.5.7"' upstream_src/Cargo.toml
          REQUIRED_RUST="$(sed -n 's/^rust-version = "\([^"]*\)"/\1/p' upstream_src/Cargo.toml | head -n1)"
          CURRENT_RUST="$(rustc --version | awk '{print $2}')"
          test -n "$REQUIRED_RUST"
          test -n "$CURRENT_RUST"
          if [ "$(printf '%s\n%s\n' "$REQUIRED_RUST" "$CURRENT_RUST" | sort -V | head -n1)" != "$REQUIRED_RUST" ]; then
            echo "ERROR: rustc $CURRENT_RUST is older than upstream MSRV $REQUIRED_RUST" >&2
            exit 1
          fi

      - name: Install build and package inspection tools
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y jq curl tar xz-utils zstd dos2unix upx-ucl file binutils

          CROSS_TAG="$(curl -fsSL -H "Authorization: Bearer ${GITHUB_TOKEN}" -H "X-GitHub-Api-Version: 2022-11-28" https://api.github.com/repos/cross-rs/cross/releases/latest | jq -r .tag_name)"
          curl -fsSL "https://github.com/cross-rs/cross/releases/download/${CROSS_TAG}/cross-x86_64-unknown-linux-musl.tar.gz" | tar -xz
          sudo install -m 0755 cross /usr/local/bin/cross

      - name: Setup verified owfeed
        uses: owfeed/owfeed/setup@v0.5.1
        with:
          version: v0.5.1

      - name: Build aarch64 Telemt 3.5.7 locked
        shell: bash
        run: |
          set -euxo pipefail
          cd upstream_src
          export CARGO_PROFILE_RELEASE_OPT_LEVEL=z
          export CARGO_PROFILE_RELEASE_LTO=true
          export CARGO_PROFILE_RELEASE_CODEGEN_UNITS=1
          export CARGO_PROFILE_RELEASE_PANIC=abort
          export CARGO_PROFILE_RELEASE_STRIP=true
          cross build --release --locked --target "$AARCH64_TARGET"
          cd ..

          upx --best --lzma "upstream_src/target/${AARCH64_TARGET}/release/telemt"
          cp "upstream_src/target/${AARCH64_TARGET}/release/telemt" "$AARCH64_OUT_BIN"
          printf '\nMTProxy v%s\n' "$VERSION" >> "$AARCH64_OUT_BIN"
          chmod 0755 "$AARCH64_OUT_BIN"
          file "$AARCH64_OUT_BIN"
          tail -c 512 "$AARCH64_OUT_BIN" | grep -a -q "MTProxy v${VERSION}"

      - name: Verify upstream x86_64 release and trailer
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p upstream_release extracted_x86_64
          gh release download "$VERSION" \
            --repo "$UPSTREAM_REPO" \
            --pattern "$X86_64_ASSET_NAME" \
            --pattern "$X86_64_ASSET_SHA256_NAME" \
            --dir upstream_release

          cd upstream_release
          sha256sum -c "$X86_64_ASSET_SHA256_NAME"
          cd ..

          tar -xzf "upstream_release/$X86_64_ASSET_NAME" -C extracted_x86_64
          BIN_PATH="$(find extracted_x86_64 -type f -name telemt | head -n1)"
          test -n "$BIN_PATH"
          install -m 0755 "$BIN_PATH" "$X86_64_OUT_BIN"
          printf '\nMTProxy v%s\n' "$VERSION" >> "$X86_64_OUT_BIN"
          tail -c 512 "$X86_64_OUT_BIN" | grep -a -q "MTProxy v${VERSION}"

      - name: Stage architecture payloads and dual-format owfeed manifest
        shell: bash
        run: |
          set -euxo pipefail
          dos2unix files/telemt.init files/telemt.config files/telemt.postinst files/telemt-web-check \
            files/telemt-web-frontend files/telemt-web-nginx files/telemt-web-haproxy.hotplug

          rm -rf .ci/stage dist-ipk dist-apk
          for arch in aarch64_generic aarch64_cortex-a53 x86_64; do
            root=".ci/stage/${arch}"
            mkdir -p "$root/usr/bin" "$root/etc/init.d" "$root/etc/config" \
              "$root/usr/libexec" "$root/etc/hotplug.d/acme"

            if [ "$arch" = x86_64 ]; then
              install -m 0755 "$X86_64_OUT_BIN" "$root/usr/bin/telemt"
            else
              install -m 0755 "$AARCH64_OUT_BIN" "$root/usr/bin/telemt"
            fi
            install -m 0755 files/telemt.init "$root/etc/init.d/telemt"
            install -m 0755 files/telemt-web-check "$root/usr/libexec/telemt-web-check"
            install -m 0755 files/telemt-web-frontend "$root/usr/libexec/telemt-web-frontend"
            install -m 0755 files/telemt-web-nginx "$root/usr/libexec/telemt-web-nginx"
            install -m 0755 files/telemt-web-haproxy.hotplug "$root/etc/hotplug.d/acme/95-telemt-web-haproxy"
            install -m 0644 files/telemt.config "$root/etc/config/telemt"
          done

          cat > owfeed.yml <<'EOF'
          version: 1
          feed:
            name: telemt-ci
            url: https://example.invalid/telemt-ci
            title: Telemt CI
            maintainer: "Telemt Team <noreply@example.invalid>"
          publish:
            - target: github-pages
          releases:
            - line: "25.12"
              format: apk
              default: true
              arches: [aarch64_generic, aarch64_cortex-a53, x86_64]
            - line: "24.10"
              format: ipk
              arches: [aarch64_generic, aarch64_cortex-a53, x86_64]
          packages:
            - name: telemt
              build: mkpkg
              arch: [aarch64_generic, aarch64_cortex-a53, x86_64]
              version: 3.5.7-r2
              files: ./.ci/stage/{arch}
              description: "Telemt 3.5.7 WEB alpha test package"
              url: https://github.com/Medvedolog/telemt_owrt
              conffiles: ["/etc/config/telemt"]
              scripts:
                post-install: ./files/telemt.postinst
          EOF

      - name: Resolve and inspect owfeed plan
        shell: bash
        run: |
          set -euxo pipefail
          owfeed lock --update
          owfeed plan
          owfeed check

      - name: Build OpenWrt 24.10 IPK set with owfeed
        shell: bash
        run: |
          set -euxo pipefail
          owfeed build --release 24.10 -o dist-ipk
          test "$(find dist-ipk -type f -name '*.ipk' | wc -l)" -eq 3
          for arch in aarch64_generic aarch64_cortex-a53 x86_64; do
            ipk="$(find "dist-ipk/${arch}" -maxdepth 1 -type f -name 'telemt*.ipk' | head -n1)"
            test -n "$ipk"
            test -s "$ipk"
            file "$ipk"
          done

      - name: Build and verify OpenWrt 25.12 APKv3 set with owfeed
        shell: bash
        run: |
          set -euxo pipefail
          owfeed build --release 25.12 -o dist-apk
          test "$(find dist-apk -type f -name '*.apk' | wc -l)" -eq 3
          for arch in aarch64_generic aarch64_cortex-a53 x86_64; do
            apk="$(find "dist-apk/${arch}" -maxdepth 1 -type f -name 'telemt*.apk' | head -n1)"
            test -n "$apk"
            test -s "$apk"
            test "$(od -An -tx1 -N3 "$apk" | tr -d ' \n')" = 414442
          done

      - name: Upload CI packages
        uses: actions/upload-artifact@v4
        with:
          name: telemt-3.5.7-web-ci
          retention-days: 7
          path: |
            telemt-aarch64-musl
            telemt-x86_64-musl
            dist-ipk/*/*.ipk
            dist-apk/*/*.apk
            owfeed.lock
