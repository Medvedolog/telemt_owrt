name: Build and Release Headless Telemt (aarch64 build + x86_64 upstream)

on:
  push:
    tags:
      - '3.*'
      - '[4-9]*'
  workflow_dispatch:
    inputs:
      build_target:
        description: 'Enter upstream Telemt tag (e.g. 3.5.6)'
        required: true
        default: '3.5.6'

jobs:
  release:
    name: Build and Package
    runs-on: ubuntu-latest
    permissions:
      contents: write
      attestations: read

    env:
      UPSTREAM_REPO: telemt/telemt
      PKG_NAME: telemt
      PKG_DESC: Advanced MTProto telemt proxy with FakeTLS and WEB Proxy support for OpenWrt. Headless core daemon with procd integration.
      AARCH64_TARGET: aarch64-unknown-linux-musl
      AARCH64_OUT_BIN: telemt-aarch64-musl
      X86_64_ASSET_NAME: telemt-x86_64-linux-musl.tar.gz
      X86_64_ASSET_SHA256_NAME: telemt-x86_64-linux-musl.tar.gz.sha256
      X86_64_OUT_BIN: telemt-x86_64-musl
      PKG_ARCH_AARCH64S: aarch64_generic aarch64_cortex-a53
      PKG_ARCH_X86_64: x86_64
      OWFEED_VERSION: v0.5.1
      OPENWRT_APK_SDK_RELEASE: '25.12.2'

    steps:
      - name: Extract version
        shell: bash
        run: |
          set -euxo pipefail

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ github.event.inputs.build_target }}"
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          else
            echo 'ERROR: unsupported release trigger' >&2
            exit 1
          fi

          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z]+)*$'; then
            echo "ERROR: build target must be a version/tag, got: $VERSION" >&2
            exit 1
          fi

          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "TAG=${VERSION}" >> "$GITHUB_ENV"
          echo "APK_VERSION=${VERSION}-r1" >> "$GITHUB_ENV"

      - name: Checkout local repository
        uses: actions/checkout@v4

      - name: Checkout upstream repository
        uses: actions/checkout@v4
        with:
          repository: telemt/telemt
          ref: ${{ env.VERSION }}
          path: upstream_src

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-musl

      - name: Verify upstream version, MSRV, and lockfile
        shell: bash
        run: |
          set -euxo pipefail

          test -f upstream_src/Cargo.lock
          grep -Fq "version = \"${VERSION}\"" upstream_src/Cargo.toml
          REQUIRED_RUST="$(sed -n 's/^rust-version = "\([^"]*\)"/\1/p' upstream_src/Cargo.toml | head -n1)"
          CURRENT_RUST="$(rustc --version | awk '{print $2}')"
          test -n "$REQUIRED_RUST"
          test -n "$CURRENT_RUST"
          echo "Upstream MSRV: $REQUIRED_RUST"
          echo "Runner rustc: $CURRENT_RUST"
          if [ "$(printf '%s\n%s\n' "$REQUIRED_RUST" "$CURRENT_RUST" | sort -V | head -n1)" != "$REQUIRED_RUST" ]; then
            echo "ERROR: rustc $CURRENT_RUST is older than upstream MSRV $REQUIRED_RUST" >&2
            exit 1
          fi

      - name: Install build and IPK packaging tools
        shell: bash
        run: |
          set -euxo pipefail

          sudo apt-get update
          sudo apt-get install -y jq curl tar xz-utils zstd dos2unix upx-ucl file binutils

          CROSS_TAG="$(curl -fsSL https://api.github.com/repos/cross-rs/cross/releases/latest | jq -r .tag_name)"
          curl -fsSL "https://github.com/cross-rs/cross/releases/download/${CROSS_TAG}/cross-x86_64-unknown-linux-musl.tar.gz" | tar -xz
          sudo install -m 0755 cross /usr/local/bin/cross

          NFPM_TAG="$(curl -fsSL https://api.github.com/repos/goreleaser/nfpm/releases/latest | jq -r .tag_name)"
          NFPM_VER="${NFPM_TAG#v}"
          curl -fsSL "https://github.com/goreleaser/nfpm/releases/download/${NFPM_TAG}/nfpm_${NFPM_VER}_Linux_x86_64.tar.gz" | tar -xz
          sudo install -m 0755 nfpm /usr/local/bin/nfpm

      - name: Setup verified owfeed
        uses: owfeed/owfeed/setup@v0.5.1
        with:
          version: v0.5.1

      - name: Build aarch64 binary with cross
        shell: bash
        run: |
          set -euxo pipefail

          cd upstream_src
          export CARGO_PROFILE_RELEASE_OPT_LEVEL=z
          export CARGO_PROFILE_RELEASE_LTO=true
          export CARGO_PROFILE_RELEASE_CODEGEN_UNITS=1
          export CARGO_PROFILE_RELEASE_PANIC=abort
          export CARGO_PROFILE_RELEASE_STRIP=true
          cross build --release --locked --target "$AARCH64_TARGET"
          cd ..

          upx --best --lzma "upstream_src/target/${AARCH64_TARGET}/release/telemt"
          cp "upstream_src/target/${AARCH64_TARGET}/release/telemt" "$AARCH64_OUT_BIN"
          printf '\nMTProxy v%s\n' "$VERSION" >> "$AARCH64_OUT_BIN"
          chmod 0755 "$AARCH64_OUT_BIN"
          file "$AARCH64_OUT_BIN"
          tail -c 512 "$AARCH64_OUT_BIN" | grep -a -q "MTProxy v${VERSION}"

      - name: Download and verify upstream x86_64 release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p upstream_release extracted_x86_64
          gh release download "$TAG" \
            --repo "$UPSTREAM_REPO" \
            --pattern "$X86_64_ASSET_NAME" \
            --pattern "$X86_64_ASSET_SHA256_NAME" \
            --dir upstream_release

          cd upstream_release
          sha256sum -c "$X86_64_ASSET_SHA256_NAME"
          cd ..

          tar -xzf "upstream_release/$X86_64_ASSET_NAME" -C extracted_x86_64
          BIN_PATH="$(find extracted_x86_64 -type f -name telemt | head -n1)"
          test -n "$BIN_PATH"
          install -m 0755 "$BIN_PATH" "$X86_64_OUT_BIN"
          printf '\nMTProxy v%s\n' "$VERSION" >> "$X86_64_OUT_BIN"
          tail -c 512 "$X86_64_OUT_BIN" | grep -a -q "MTProxy v${VERSION}"

      - name: Normalize OpenWrt scripts
        shell: bash
        run: |
          set -euxo pipefail
          dos2unix files/telemt.init files/telemt.config files/telemt-web-check \
            files/telemt-web-frontend files/telemt-web-nginx files/telemt-web-haproxy.hotplug

      - name: Generate maintainer scripts
        shell: bash
        run: |
          set -euxo pipefail

          cat > postinst.sh <<EOF2
          #!/bin/sh
          echo ""
          echo "================================================================="
          echo " Installed Headless Telemt version ${VERSION}"
          echo " Managed by procd via /etc/init.d/telemt"
          echo " LuCI package (optional): luci-app-telemt"
          echo "================================================================="

          if pidof telemt >/dev/null 2>&1; then
              killall -9 telemt 2>/dev/null || true
          fi

          if [ -d "/etc/telemt" ]; then
              mv /etc/telemt /etc/telemt.disabled_by_luci 2>/dev/null || true
          fi

          old_metrics=\$(uci -q get telemt.general.metrics_port)
          if [ "\$old_metrics" = "9091" ] || [ "\$old_metrics" = "9090" ]; then
              uci set telemt.general.metrics_port='9092'
              uci set telemt.general.api_port='9091'
              uci commit telemt 2>/dev/null || true
          fi

          chmod 0755 /usr/bin/telemt 2>/dev/null || true
          chmod 0755 /etc/init.d/telemt 2>/dev/null || true
          chmod 0755 /usr/libexec/telemt-web-check 2>/dev/null || true
          chmod 0755 /usr/libexec/telemt-web-frontend 2>/dev/null || true
          chmod 0755 /usr/libexec/telemt-web-nginx 2>/dev/null || true
          chmod 0755 /etc/hotplug.d/acme/95-telemt-web-haproxy 2>/dev/null || true
          chmod 0644 /etc/config/telemt 2>/dev/null || true

          /etc/init.d/telemt enable 2>/dev/null || true
          /etc/init.d/telemt restart 2>/dev/null || /etc/init.d/telemt start 2>/dev/null || true
          exit 0
          EOF2

          cat > prerm.sh <<'EOF2'
          #!/bin/sh
          echo ""
          echo "================================================================="
          echo " Removing Headless Telemt package"
          echo "================================================================="
          if [ -x /usr/libexec/telemt-web-frontend ] && \
             [ -f /etc/haproxy.cfg.telemt-backup ] && \
             grep -qF '# TELEMT-MANAGED-HAPROXY v1' /etc/haproxy.cfg 2>/dev/null; then
              /usr/libexec/telemt-web-frontend restore 2>/dev/null || true
          fi
          if [ -x /usr/libexec/telemt-web-nginx ] && \
             grep -qF '# TELEMT-MANAGED-NGINX v1' /etc/nginx/conf.d/telemt-web.conf 2>/dev/null; then
              /usr/libexec/telemt-web-nginx restore 2>/dev/null || true
          fi
          /etc/init.d/telemt disable 2>/dev/null || true
          /etc/init.d/telemt stop 2>/dev/null || true
          exit 0
          EOF2

          cat > postrm.sh <<'EOF2'
          #!/bin/sh
          echo ""
          echo "================================================================="
          echo " Headless Telemt removed"
          echo " Cleaning generated runtime files"
          echo "================================================================="
          rm -f /var/etc/telemt.toml
          rm -f /var/etc/telemt.version
          if ! grep -qF '# TELEMT-MANAGED-HAPROXY v1' /etc/haproxy.cfg 2>/dev/null; then
              rm -f /var/etc/telemt-haproxy.pem
          fi
          rm -f /tmp/etc/telemt.toml
          rm -f /tmp/telemt_stats.txt
          rm -rf /tmp/telemt-web-haproxy.lock /tmp/telemt-web-nginx.lock
          if uci -q get firewall.telemt_web_https >/dev/null 2>&1; then
              uci -q delete firewall.telemt_web_https
              uci commit firewall 2>/dev/null || true
              /etc/init.d/firewall reload 2>/dev/null || true
          fi
          exit 0
          EOF2

          chmod 0755 postinst.sh prerm.sh postrm.sh

      - name: Build OpenWrt 24.10 IPK packages
        shell: bash
        run: |
          set -euxo pipefail
          export SOURCE_DATE_EPOCH=1704067200

          build_ipk() {
            ARCH="$1"
            BIN="$2"
            CFG="nfpm_ipk_${ARCH}.yaml"
            cat > "$CFG" <<EOF2
          name: ${PKG_NAME}
          arch: ${ARCH}
          platform: linux
          version: ${VERSION}
          section: net
          priority: optional
          maintainer: Telemt Team
          description: "${PKG_DESC}"
          contents:
            - src: ./${BIN}
              dst: /usr/bin/telemt
              file_info: { mode: 0755, mtime: 2024-01-01T00:00:00Z }
            - src: ./files/telemt.init
              dst: /etc/init.d/telemt
              file_info: { mode: 0755, mtime: 2024-01-01T00:00:00Z }
            - src: ./files/telemt-web-check
              dst: /usr/libexec/telemt-web-check
              file_info: { mode: 0755, mtime: 2024-01-01T00:00:00Z }
            - src: ./files/telemt-web-frontend
              dst: /usr/libexec/telemt-web-frontend
              file_info: { mode: 0755, mtime: 2024-01-01T00:00:00Z }
            - src: ./files/telemt-web-nginx
              dst: /usr/libexec/telemt-web-nginx
              file_info: { mode: 0755, mtime: 2024-01-01T00:00:00Z }
            - src: ./files/telemt-web-haproxy.hotplug
              dst: /etc/hotplug.d/acme/95-telemt-web-haproxy
              file_info: { mode: 0755, mtime: 2024-01-01T00:00:00Z }
            - src: ./files/telemt.config
              dst: /etc/config/telemt
              type: config
              file_info: { mode: 0644, mtime: 2024-01-01T00:00:00Z }
          scripts:
            postinstall: ./postinst.sh
            preremove: ./prerm.sh
            postremove: ./postrm.sh
          EOF2

            nfpm package --config "$CFG" --packager ipk \
              --target "${PKG_NAME}_${VERSION}_${ARCH}.ipk"
            test -s "${PKG_NAME}_${VERSION}_${ARCH}.ipk"
          }

          for ARCH in ${PKG_ARCH_AARCH64S}; do
            build_ipk "$ARCH" "$AARCH64_OUT_BIN"
          done
          build_ipk "$PKG_ARCH_X86_64" "$X86_64_OUT_BIN"

      - name: Stage OpenWrt 25.12 APKv3 payloads
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf .release-apk dist

          for ARCH in ${PKG_ARCH_AARCH64S} ${PKG_ARCH_X86_64}; do
            ROOT=".release-apk/${ARCH}"
            mkdir -p "$ROOT/usr/bin" "$ROOT/etc/init.d" "$ROOT/etc/config" \
              "$ROOT/usr/libexec" "$ROOT/etc/hotplug.d/acme"

            if [ "$ARCH" = "$PKG_ARCH_X86_64" ]; then
              install -m 0755 "$X86_64_OUT_BIN" "$ROOT/usr/bin/telemt"
            else
              install -m 0755 "$AARCH64_OUT_BIN" "$ROOT/usr/bin/telemt"
            fi
            install -m 0755 files/telemt.init "$ROOT/etc/init.d/telemt"
            install -m 0755 files/telemt-web-check "$ROOT/usr/libexec/telemt-web-check"
            install -m 0755 files/telemt-web-frontend "$ROOT/usr/libexec/telemt-web-frontend"
            install -m 0755 files/telemt-web-nginx "$ROOT/usr/libexec/telemt-web-nginx"
            install -m 0755 files/telemt-web-haproxy.hotplug "$ROOT/etc/hotplug.d/acme/95-telemt-web-haproxy"
            install -m 0644 files/telemt.config "$ROOT/etc/config/telemt"
          done

          cat > owfeed-release.yml <<EOF2
          version: 1
          feed:
            name: telemt-release
            url: https://github.com/${GITHUB_REPOSITORY}
            title: Telemt OpenWrt
            maintainer: "Medvedolog <Medvedolog@github.com>"
          publish:
            - target: github-pages
          build:
            sdk:
              release: "${OPENWRT_APK_SDK_RELEASE}"
          releases:
            - line: "25.12"
              format: apk
              default: true
              arches: [aarch64_generic, aarch64_cortex-a53, x86_64]
          packages:
            - name: ${PKG_NAME}
              build: mkpkg
              arch: [aarch64_generic, aarch64_cortex-a53, x86_64]
              version: ${APK_VERSION}
              files: ./.release-apk/{arch}
              description: "${PKG_DESC}"
              url: https://github.com/${GITHUB_REPOSITORY}
              maintainer: "Medvedolog <Medvedolog@github.com>"
              repo-commit: env:GITHUB_SHA
              conffiles: ["/etc/config/telemt"]
              scripts:
                post-install: ./postinst.sh
                pre-deinstall: ./prerm.sh
                post-deinstall: ./postrm.sh
          EOF2

      - name: Build and verify OpenWrt 25.12 APKv3 packages
        shell: bash
        run: |
          set -euxo pipefail
          export SOURCE_DATE_EPOCH=1704067200

          owfeed --config owfeed-release.yml lock --update
          owfeed --config owfeed-release.yml build --release 25.12 -o dist

          test "$(find dist -type f -name '*.apk' | wc -l)" -eq 3
          for ARCH in ${PKG_ARCH_AARCH64S} ${PKG_ARCH_X86_64}; do
            SRC="dist/${ARCH}/${PKG_NAME}-${APK_VERSION}.apk"
            DST="${PKG_NAME}_${VERSION}_${ARCH}.apk"
            test -s "$SRC"
            MAGIC="$(od -An -tx1 -N3 "$SRC" | tr -d ' \n')"
            test "$MAGIC" = 414442
            cp "$SRC" "$DST"
            test -s "$DST"
          done

      - name: Show built files
        shell: bash
        run: |
          set -euxo pipefail
          ls -la *.ipk *.apk "$AARCH64_OUT_BIN" "$X86_64_OUT_BIN"

      - name: Fetch upstream release notes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p .release
          if gh release view "$TAG" -R "$UPSTREAM_REPO" --json body,name >/tmp/upstream_release.json 2>/dev/null; then
            jq -r '.body // ""' /tmp/upstream_release.json > .release/body.txt
          else
            : > .release/body.txt
          fi

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euxo pipefail
          TITLE="Release ${TAG}"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TITLE" --notes-file .release/body.txt
            gh release upload "$TAG" \
              "$AARCH64_OUT_BIN" "$X86_64_OUT_BIN" *.ipk *.apk --clobber
          else
            gh release create "$TAG" \
              "$AARCH64_OUT_BIN" "$X86_64_OUT_BIN" *.ipk *.apk \
              --title "$TITLE" --notes-file .release/body.txt
          fi
